name: Rust candidate release

on:
  push:
    tags: ['v*-rust.*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      package-release: true

  draft:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: rust-release-*
      - name: Assemble and verify the native packages
        run: |
          version=$(cat VERSION)
          test "$GITHUB_REF_NAME" = "v$version"
          mkdir dist
          for arch in arm64 amd64; do
            name="rexweb-$version-rust-linux-$arch.tar.gz"
            cp "artifacts/rust-release-$arch/$name" dist/
            cat "artifacts/rust-release-$arch/SHA256SUMS-rust" >> dist/SHA256SUMS-rust
          done
          (cd dist && sha256sum --check --strict SHA256SUMS-rust)
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS-rust \
            --verify-tag --draft --prerelease --title "rexweb $version" \
            --notes-file CHANGELOG.md
