<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9f9fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#202023" media="(prefers-color-scheme: dark)">
  <title>Rex Workspace</title>
  <link rel="stylesheet" href="/static/monospace.css">
  <link rel="stylesheet" href="/static/workspace.css">
  <script type="module" src="/static/js/workspace.js"></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-session" viewBox="0 0 24 24"><path d="M14 17H3V4h18v8M7 21h5m-2-4v4"/><circle cx="18" cy="16" r="2"/><path d="M14 22v-1a4 4 0 0 1 8 0v1"/></symbol>
    <symbol id="icon-terminal" viewBox="0 0 24 24"><path d="m5 5 7 7-7 7m9 0h6"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="icon-command" viewBox="0 0 24 24"><path d="M8 8H5a3 3 0 1 1 3-3v14a3 3 0 1 1-3-3h14a3 3 0 1 1-3 3V5a3 3 0 1 1 3 3Z"/></symbol>
    <symbol id="icon-right" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/></symbol>
    <symbol id="icon-down" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 12h18"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
  </svg>
  <header class="tab-bar">
    <button id="session-switcher" class="session-button" aria-label="Change session" title="Change session (⌘K / Ctrl+K)" aria-haspopup="dialog">
      <svg class="icon" aria-hidden="true"><use href="#icon-session"/></svg>
      <span id="session-label">Sessions</span>
      <svg class="icon chevron" aria-hidden="true"><use href="#icon-chevron"/></svg>
    </button>
    <nav id="windows" aria-label="Terminal tabs"></nav>
    <div class="toolbar-actions">
      <button id="command-palette" class="icon-button" aria-label="Command palette" title="Command palette (⇧⌘P / Ctrl+Shift+P)" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#icon-command"/></svg></button>
      <button class="icon-button" data-op="new-window" data-session aria-label="New tab" title="New tab"><svg class="icon" aria-hidden="true"><use href="#icon-plus"/></svg></button>
    </div>
  </header>
  <p id="status" role="status" aria-live="polite"></p>
  <main id="workspace" aria-label="Terminal workspace"></main>
  <dialog id="chooser" aria-labelledby="chooser-title">
    <div class="chooser-heading"><h1 id="chooser-title">Sessions</h1><button class="icon-button" data-dismiss aria-label="Close dialog"><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg></button></div>
    <input id="chooser-filter" type="search" placeholder="Filter or create…" aria-label="Filter sessions" autocomplete="off" spellcheck="false">
    <div id="chooser-items" class="chooser-items"></div>
    <footer><span id="chooser-hint">Select a session to resume it</span><kbd>esc</kbd></footer>
  </dialog>
  <dialog id="action-dialog" aria-labelledby="action-title" aria-describedby="action-description">
    <form id="action-form">
      <h1 id="action-title"></h1>
      <p id="action-description"></p>
      <label id="action-label" for="action-name">Session name</label>
      <input id="action-name" name="label" maxlength="128" autocomplete="off">
      <div class="dialog-actions"><button type="button" data-dismiss>Cancel</button><button id="action-submit" type="submit" class="primary">Create session</button></div>
    </form>
  </dialog>
</body>
</html>
